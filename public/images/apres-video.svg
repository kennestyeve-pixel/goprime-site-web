<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 650" width="450" height="650">
  <defs>
    <linearGradient id="videoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="50%" stop-color="#0E355C" />
      <stop offset="100%" stop-color="#051329" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF5000" />
    </linearGradient>
    <radialGradient id="productGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0A2540" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Frame -->
  <rect width="450" height="650" rx="20" fill="url(#videoBg)" stroke="#FF7A00" stroke-width="2" />

  <!-- Badge Header: VIDÉO PUBLICITAIRE FINALE (APRÈS) -->
  <g transform="translate(24, 24)">
    <rect width="230" height="36" rx="18" fill="url(#badgeGrad)" />
    <text x="115" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">VIDÉO PUBLICITAIRE FINALE</text>
  </g>

  <g transform="translate(24, 68)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">Format vertical 9:16 prêt à publier</text>
  </g>

  <!-- Product Glow & Highlighting -->
  <circle cx="225" cy="330" r="160" fill="url(#productGlow)" />

  <!-- Hook Overlay (Accroche publicitaire animée) -->
  <g transform="translate(45, 120)">
    <rect width="360" height="48" rx="12" fill="#FFFFFF" />
    <text x="180" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#0A2540" text-anchor="middle">LE PARFUM QUI DURE TOUTE LA JOURNÉE</text>
  </g>

  <!-- Transformed Product Centerpiece -->
  <g transform="translate(225, 330)">
    <ellipse cx="0" cy="130" rx="130" ry="25" fill="#051329" opacity="0.8" />
    
    <!-- Stylized Glow Particles -->
    <circle cx="-110" cy="-60" r="3" fill="#FFB703" />
    <circle cx="115" cy="-40" r="4" fill="#FFB703" />
    <circle cx="-90" cy="50" r="3" fill="#38BDF8" />
    <circle cx="100" cy="70" r="3" fill="#38BDF8" />

    <!-- Perfume Bottle (Transformed & Glossy) -->
    <rect x="-65" y="-70" width="130" height="170" rx="20" fill="#0F172A" stroke="#FF7A00" stroke-width="3" />
    <rect x="-30" y="-115" width="60" height="45" rx="8" fill="#FF7A00" />
    
    <!-- Gold / Amber Liquid Simulation -->
    <path d="M-60,10 C-60,70 60,70 60,10 L60,85 C60,93 53,100 45,100 L-45,100 C-53,100 -60,93 -60,85 Z" fill="#FF9E00" opacity="0.75" />
    
    <!-- Premium Label -->
    <rect x="-45" y="-20" width="90" height="75" rx="8" fill="#0A2540" stroke="#FFD166" stroke-width="1.5" />
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#FFD166" text-anchor="middle">ÉLIXIR D'OR</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF" text-anchor="middle">EAU DE PARFUM</text>
    <line x1="-20" y1="36" x2="20" y2="36" stroke="#FFD166" stroke-width="1.5" />
  </g>

  <!-- CTA Sticker: COMMANDER SUR WHATSAPP -->
  <g transform="translate(90, 480)">
    <rect width="270" height="44" rx="22" fill="#25D366" />
    <!-- WhatsApp Small Icon -->
    <circle cx="28" cy="22" r="12" fill="#FFFFFF" />
    <path d="M28 14c-4.4 0-8 3.6-8 8 0 1.4.4 2.8 1.1 4L20 30l4.2-1.1c1.2.7 2.5 1.1 3.8 1.1 4.4 0 8-3.6 8-8s-3.6-8-8-8z" fill="#25D366"/>
    <text x="145" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">DISPONIBLE SUR WHATSAPP</text>
  </g>

  <!-- Play icon overlay -->
  <g transform="translate(225, 330)">
    <circle cx="0" cy="0" r="36" fill="rgba(10,37,64,0.75)" stroke="#FFFFFF" stroke-width="2.5" />
    <polygon points="-7,-13 15,0 -7,13" fill="#FFFFFF" />
  </g>

  <!-- Notice pill at bottom -->
  <g transform="translate(24, 570)">
    <rect width="402" height="54" rx="14" fill="#051329" stroke="rgba(255,255,255,0.15)" />
    <circle cx="28" cy="27" r="14" fill="#1E293B" />
    <text x="28" y="32" font-family="sans-serif" font-size="16" fill="#FF7A00" text-anchor="middle">⚡</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Montage dynamique, rythme & accroches</text>
    <text x="52" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="400" fill="#94A3B8">Optimisé pour capter l'attention dans les 3 premières secondes</text>
  </g>
</svg>
