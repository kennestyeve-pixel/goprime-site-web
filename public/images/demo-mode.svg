<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="bgMode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0A2540" />
    </linearGradient>
    <linearGradient id="glowMode" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="360" height="640" rx="16" fill="url(#bgMode)" />
  <circle cx="180" cy="300" r="140" fill="url(#glowMode)" />

  <!-- Category Tag -->
  <g transform="translate(20, 24)">
    <rect width="165" height="30" rx="15" fill="rgba(236,72,153,0.2)" stroke="#EC4899" stroke-width="1.5" />
    <text x="82" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#F472B6" text-anchor="middle">MODE & VÊTEMENTS</text>
  </g>

  <!-- Product visual illustration -->
  <g transform="translate(180, 290)">
    <circle cx="0" cy="0" r="75" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
    <!-- Dress / Outfit silhouette -->
    <path d="M-25,-40 L-10,-55 L10,-55 L25,-40 L15,5 L35,50 L-35,50 L-15,5 Z" fill="#F43F5E" opacity="0.9" />
    <polygon points="-10,-55 10,-55 0,-35" fill="#FFFFFF" opacity="0.3" />
  </g>

  <!-- Animated sticker teaser -->
  <g transform="translate(20, 420)">
    <rect width="210" height="34" rx="8" fill="#FF7A00" />
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">NOUVEL ARRIVAGE 👗</text>
  </g>
  <g transform="translate(20, 462)">
    <rect width="170" height="28" rx="6" fill="rgba(0,0,0,0.6)" />
    <text x="12" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#22C55E">LIVRAISON EN 24H</text>
  </g>

  <!-- Title & Action -->
  <g transform="translate(20, 560)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Robe de Soirée & Prêt-à-porter</text>
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Vidéo verticale 9:16 avec zoom produit</text>
  </g>

  <!-- Play Circle -->
  <g transform="translate(180, 290)">
    <circle cx="0" cy="0" r="30" fill="rgba(10,37,64,0.85)" stroke="#FF7A00" stroke-width="2" />
    <polygon points="-6,-10 12,0 -6,10" fill="#FFFFFF" />
  </g>
</svg>
