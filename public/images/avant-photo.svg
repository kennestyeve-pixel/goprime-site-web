<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 650" width="450" height="650">
  <defs>
    <linearGradient id="photoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>

  <!-- Background Frame -->
  <rect width="450" height="650" rx="20" fill="url(#photoBg)" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Badge Header: PHOTO DU PRODUIT (AVANT) -->
  <g transform="translate(24, 24)">
    <rect width="180" height="36" rx="18" fill="#475569" />
    <text x="90" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">PHOTO DU PRODUIT</text>
  </g>

  <g transform="translate(24, 68)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#64748B">Ce que vous envoyez sur WhatsApp</text>
  </g>

  <!-- Photo Mockup: A simple product on a surface taken by smartphone -->
  <g transform="translate(225, 330)">
    <!-- Countertop / wooden texture lines -->
    <ellipse cx="0" cy="140" rx="170" ry="35" fill="#94A3B8" opacity="0.4" />
    <rect x="-180" y="130" width="360" height="15" fill="#94A3B8" opacity="0.3" rx="4" />
    
    <!-- Camera angle indicator lines -->
    <path d="M-150,-120 L-130,-120 M-150,-120 L-150,-100" stroke="#94A3B8" stroke-width="3" fill="none" />
    <path d="M150,-120 L130,-120 M150,-120 L150,-100" stroke="#94A3B8" stroke-width="3" fill="none" />
    <path d="M-150,100 L-130,100 M-150,100 L-150,80" stroke="#94A3B8" stroke-width="3" fill="none" />
    <path d="M150,100 L130,100 M150,100 L150,80" stroke="#94A3B8" stroke-width="3" fill="none" />

    <!-- Product Icon (Bag / Perfume / Bottle) -->
    <rect x="-65" y="-70" width="130" height="170" rx="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" />
    <!-- Perfume cap -->
    <rect x="-30" y="-110" width="60" height="40" rx="8" fill="#64748B" />
    <!-- Perfume label -->
    <rect x="-45" y="-20" width="90" height="80" rx="6" fill="#F1F5F9" stroke="#E2E8F0" />
    <line x1="-30" y1="5" x2="30" y2="5" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-20" y1="20" x2="20" y2="20" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <line x1="-35" y1="35" x2="35" y2="35" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Notice pill at bottom -->
  <g transform="translate(24, 570)">
    <rect width="402" height="54" rx="14" fill="#FFFFFF" stroke="#E2E8F0" />
    <circle cx="28" cy="27" r="14" fill="#E0F2FE" />
    <text x="28" y="32" font-family="sans-serif" font-size="16" fill="#0284C7" text-anchor="middle">📷</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#1E293B">Photo simple prise avec votre téléphone</text>
    <text x="52" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="400" fill="#64748B">Pas besoin d'appareil photo professionnel ni de studio</text>
  </g>
</svg>
