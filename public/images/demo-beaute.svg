<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="bgBeaute" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0A2540" />
    </linearGradient>
    <linearGradient id="glowBeaute" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="360" height="640" rx="16" fill="url(#bgBeaute)" />
  <circle cx="180" cy="300" r="140" fill="url(#glowBeaute)" />

  <!-- Category Tag -->
  <g transform="translate(20, 24)">
    <rect width="180" height="30" rx="15" fill="rgba(16,185,129,0.2)" stroke="#10B981" stroke-width="1.5" />
    <text x="90" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">BEAUTÉ & COSMÉTIQUES</text>
  </g>

  <!-- Product visual illustration -->
  <g transform="translate(180, 290)">
    <circle cx="0" cy="0" r="75" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
    <!-- Cream jar / serum bottle -->
    <rect x="-35" y="-30" width="70" height="65" rx="12" fill="#10B981" opacity="0.85" />
    <rect x="-20" y="-50" width="40" height="20" rx="6" fill="#D1FAE5" />
    <circle cx="0" cy="5" r="14" fill="#FFFFFF" opacity="0.3" />
  </g>

  <!-- Animated sticker teaser -->
  <g transform="translate(20, 420)">
    <rect width="230" height="34" rx="8" fill="#FF7A00" />
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">PEAU ÉCLATANTE EN 7J ✨</text>
  </g>
  <g transform="translate(20, 462)">
    <rect width="185" height="28" rx="6" fill="rgba(0,0,0,0.6)" />
    <text x="12" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FBBF24">100% INGRÉDIENTS NATURELS</text>
  </g>

  <!-- Title & Action -->
  <g transform="translate(20, 560)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Gamme Soins & Crème Visage</text>
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Vidéo verticale avec mise en avant bienfaits</text>
  </g>

  <!-- Play Circle -->
  <g transform="translate(180, 290)">
    <circle cx="0" cy="0" r="30" fill="rgba(10,37,64,0.85)" stroke="#FF7A00" stroke-width="2" />
    <polygon points="-6,-10 12,0 -6,10" fill="#FFFFFF" />
  </g>
</svg>
